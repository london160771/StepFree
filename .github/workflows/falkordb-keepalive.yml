# Keeps the FalkorDB Cloud free instance active so it is not stopped for inactivity.
# Runs one read-only query against the StepFree graph; it never writes or reseeds.
name: FalkorDB keep-alive

on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install the FalkorDB client
        run: npm install --no-save --no-package-lock falkordb@^6.8.0

      - name: Run a read-only query
        env:
          FALKORDB_URL: ${{ secrets.FALKORDB_URL }}
        run: |
          node --input-type=module -e "
          import { FalkorDB } from 'falkordb';
          if (!process.env.FALKORDB_URL) throw new Error('The FALKORDB_URL repository secret is not set.');
          const db = await FalkorDB.connect({ url: process.env.FALKORDB_URL });
          const graphs = await db.list();
          console.log('Graphs:', graphs.join(', ') || '(none)');
          if (graphs.includes('stepfree')) {
            const reply = await db.selectGraph('stepfree').roQuery('MATCH (s:Station) RETURN count(s) AS stations');
            console.log('Stations in graph:', reply.data[0].stations);
          }
          await db.close();
          "
